# 这是软件目录的权威维护文件，工作台直接读取并校验它。
# 维护者只填写产品信息、来源用途和地址，不填写网址的技术类型。
# enabled = false 的条目是待补充的未启用软件条目；工作台不向用户展示，也不能执行。
# release_state = "draft" 的目录不能进入正式发行包。

