# 新增软件时复制下面的注释模板。一个启用的软件必须恰好有一个 primary 来源。
# [[software]]
# id = "stable-id"
# enabled = true
# name = "软件名称"
# tier = "basic"                    # basic 或 normal
# category_id = "stable-category-id"
# branch = "Windows 个人版"
# version_policy = "latest_stable"  # latest_stable、latest_stable_with_history、fixed 或 maintainer_provided
# fixed_version = "1.2.3"           # 仅 fixed 时填写
# dependencies = ["dependency-id"]  # 没有依赖时填写 []
# bundled_editions = ["large_offline"]
# notice = "需要向用户显示的简短提示"
# optimization_note = "安装完成后可提供的软件优化说明"
# install_profile = "profile-id"    # 只有存在安装阶段偏好或特殊安装能力时填写
#
# [[software.sources]]
# purpose = "primary"               # primary、alternative 或 project_backup
# address = "https://example.com/download"
# version = "1.2.3"                 # project_backup 或 maintainer_provided 无法自动得出版本时必填
#
# [[software.sources.history]]
# version = "1.2.2"
# address = "https://example.com/releases/1.2.2"
# reason = "保留原因"
# visible = true
#
# [software.education]
# address = "https://example.com/education"
# description = "帮助用户取得官方教育版的说明"
#
